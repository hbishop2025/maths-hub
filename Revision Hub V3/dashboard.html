<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choose Year 7, 8 or 9 and open the matching SJWMS digital mathematics textbook chapter.">
  <meta name="theme-color" content="#071719">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="assets/theme-init.js"></script>
  <link rel="stylesheet" href="assets/official/official-site.css">
  <link rel="stylesheet" href="assets/official/textbook-stage.css">
  <title>KS3 Textbooks | SJWMS Maths</title>
</head>
<body class="future-textbook-page textbook-stage-page" data-root="." data-section="ks3" data-theme-control="false" data-textbook-await-choice>
  <div id="site-header"></div>
  <main id="main-content">
    <section class="textbook-stage" aria-labelledby="textbook-stage-title">
      <div class="textbook-stage__glow textbook-stage__glow--one" aria-hidden="true"></div>
      <div class="textbook-stage__glow textbook-stage__glow--two" aria-hidden="true"></div>
      <div class="textbook-stage__inner">
        <header class="textbook-stage__heading">
          <a href="index.html" aria-label="Return to the SJWMS Maths homepage"><img src="assets/favicon.svg" alt="" width="64" height="64"></a>
          <h1 id="textbook-stage-title"><span>SJWMS</span><strong>MATHS</strong></h1>
          <p>Choose your year</p>
        </header>

        <div class="textbook-stage__years" role="group" aria-label="Choose your textbook year">
          <button class="textbook-stage__year textbook-stage__year--7" type="button" data-textbook-year="7" aria-pressed="false" aria-expanded="false" aria-controls="textbook-unit-panel">
            <span>07</span><strong>Year 7</strong><small>Open textbook</small><b aria-hidden="true">↓</b>
          </button>
          <button class="textbook-stage__year textbook-stage__year--8" type="button" data-textbook-year="8" aria-pressed="false" aria-expanded="false" aria-controls="textbook-unit-panel">
            <span>08</span><strong>Year 8</strong><small>Open textbook</small><b aria-hidden="true">↓</b>
          </button>
          <button class="textbook-stage__year textbook-stage__year--9" type="button" data-textbook-year="9" aria-pressed="false" aria-expanded="false" aria-controls="textbook-unit-panel">
            <span>09</span><strong>Year 9</strong><small>Open textbook</small><b aria-hidden="true">↓</b>
          </button>
        </div>

        <section class="textbook-stage__unit-panel" id="textbook-unit-panel" data-textbook-unit-panel data-state="closed" aria-live="polite" aria-hidden="true">
          <header class="textbook-stage__unit-heading">
            <div><span>Selected textbook</span><h2 id="textbook-unit-heading">Choose a year to see its units</h2></div>
            <strong>10 units</strong>
          </header>
          <aside class="textbook-stage__access-note">
            <span aria-hidden="true">i</span>
            <p><strong>School access required.</strong> Open each link through your school Google account. Links open in a new tab.</p>
          </aside>
          <div class="unit-option-grid" id="textbook-unit-list"></div>
        </section>

        <nav class="textbook-stage__links" aria-label="Other KS3 pages">
          <a href="ks3_hub.html">KS3 revision <span aria-hidden="true">→</span></a>
          <a href="sparx.html">SPARX support <span aria-hidden="true">→</span></a>
        </nav>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/site-shell.js" defer></script>
  <script src="assets/support-pages.js" defer></script>
</body>
</html>
