<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surd-O: The Radical Card Game</title>
    
    <link rel="stylesheet" href="../assets/official/game-utilities.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-bg1: rgb(15, 23, 42); /* slate-900 */
            --color-bg2: rgb(30, 27, 75); /* indigo-950 */
            --color-1: 18, 113, 255; /* Blue */
            --color-2: 221, 74, 255; /* Purple */
            --color-3: 100, 220, 255; /* Cyan */
            --color-4: 200, 50, 50;   /* Red */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg1);
            color: white;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-poppins {
            font-family: 'Poppins', sans-serif;
        }

        /* --- Modern Mesh Gradient Animation --- */
        .mesh-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(to bottom right, var(--color-bg1), var(--color-bg2));
            overflow: hidden;
        }

        .gradient-blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: moveBlob 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(var(--color-1), 0.8) 0%, rgba(var(--color-1), 0) 70%); }
        .blob-2 { top: 40%; right: -20%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(var(--color-2), 0.6) 0%, rgba(var(--color-2), 0) 70%); animation-delay: -5s; }
        .blob-3 { bottom: -20%; left: 20%; width: 55vw; height: 55vw; background: radial-gradient(circle, rgba(var(--color-3), 0.5) 0%, rgba(var(--color-3), 0) 70%); animation-delay: -10s; }
        .blob-4 { top: 10%; right: 20%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(var(--color-4), 0.4) 0%, rgba(var(--color-4), 0) 70%); animation-delay: -15s; }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(10%, 15%) scale(1.1); }
            100% { transform: translate(-10%, -5%) scale(0.9); }
        }

        /* --- Glassmorphism --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- Animations --- */
        @keyframes bounce-in {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slide-up {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slide-up 0.5s ease-out forwards;
        }

        .card-hover-effect {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover-effect:hover {
            transform: translateY(-12px) scale(1.05);
            z-index: 50;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        /* Custom Scrollbar for Hand */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
  <script src="../assets/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/official/game-shell.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
</head>
<body class="design-v3 experience-v3 labs-game labs-game--surdo" data-root=".." data-section="labs" data-theme-control="false" data-game-title="Surd-O" data-game-topic="Equivalent surds" style="--game-accent:#dd4aff;--game-accent-rgb:221,74,255">
  <div id="site-header"></div>
  <div class="experience-ribbon"><div class="experience-ribbon__inner"><span><strong>Maths Labs</strong> · Surd-O</span><a href="../maths_labs.html">Back to Maths Labs</a></div></div>
  <span id="main-content" tabindex="-1"></span>
    <div class="mesh-background">
        <div class="gradient-blob blob-1"></div>
        <div class="gradient-blob blob-2"></div>
        <div class="gradient-blob blob-3"></div>
        <div class="gradient-blob blob-4"></div>
    </div>
    
    <div id="root"></div>
    <script src="../assets/games/surd-o.js"></script>
  <div id="site-footer"></div>
  <script src="../assets/game-shell.js" defer></script>
  <script src="../assets/site-shell.js" defer></script>
</body>
</html>
